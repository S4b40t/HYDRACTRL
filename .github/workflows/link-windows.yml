name: Link Portable Windows validation

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/link-windows.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve repository line endings for lint
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install locked dependencies and check sources
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --frozen-lockfile
          bun run lint
          bun test desktop/src/main/linkService.test.js desktop/src/main/linkIpc.test.js desktop/src/main/linkTiming.test.js src/client/core/linkClient.test.js
          Push-Location desktop
          bun install --frozen-lockfile
          Pop-Location
      - name: Build the Windows x64 Portable ZIP locally
        run: ./desktop/scripts/build-link-portable.ps1
      - name: Extract the test package into a new folder
        id: extract
        run: |
          $archive = Get-ChildItem 'desktop/dist/HYDRACTRL-*-win-x64-Portable-*.zip' | Select-Object -First 1
          if (!$archive) { throw 'Portable ZIP is missing.' }
          $destination = Join-Path $env:RUNNER_TEMP 'hydractrl-link-portable'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination
          "HYDRACTRL_LINK_PORTABLE=$destination" >> $env:GITHUB_ENV
      - name: Launch and close the companion peer window
        run: |
          $expected = 'HYDRACTRL Link Test Peer'
          $peer = Start-Process "$env:HYDRACTRL_LINK_PORTABLE/Link Test Peer/LinkTestPeer.exe" -PassThru
          try {
            for ($i = 0; $i -lt 40 -and !$peer.HasExited -and $peer.MainWindowTitle -ne $expected; $i++) {
              Start-Sleep -Milliseconds 250
              $peer.Refresh()
            }
            if ($peer.MainWindowTitle -ne $expected) {
              throw "Link Test Peer window did not open. Title='$($peer.MainWindowTitle)' Exited=$($peer.HasExited) ExitCode=$($peer.ExitCode)"
            }
            if (!$peer.CloseMainWindow() -or !$peer.WaitForExit(5000) -or $peer.ExitCode -ne 0) {
              throw 'Link Test Peer window did not close cleanly.'
            }
            Write-Host 'Link Test Peer window opened and exited cleanly.'
          } finally {
            if (!$peer.HasExited) { Stop-Process -Id $peer.Id -Force }
          }
      - name: Exercise the installed helper and real Link SDK peer
        if: ${{ !cancelled() && steps.extract.outcome == 'success' }}
        working-directory: desktop
        run: |
          $env:HYDRACTRL_LINK_TEST_PEER = "$env:HYDRACTRL_LINK_PORTABLE/Link Test Peer/LinkTestPeer.exe"
          node scripts/smoke.mjs --executable "$env:HYDRACTRL_LINK_PORTABLE/HYDRACTRL/HYDRACTRL Link Experimental.exe" --software-gl --optional-output
